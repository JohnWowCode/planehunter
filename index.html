<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04101C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plane Hunter">
<title>PLANE HUNTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   PLANE HUNTER
   The sky behind the app is the real sky: its colour comes from
   the sun's actual altitude at your position, right now.
   The interface stays in night tones so it still reads at noon.
   ========================================================== */
:root{
  --sky-top:#06101F; --sky-mid:#0A1A30; --sky-horizon:#122744; --sky-glow:#1B3557;
  --star:0.9;
  --panel:rgba(8,19,32,.68);
  --panel-2:rgba(11,26,42,.84);
  --panel-3:rgba(16,36,56,.94);
  --line:rgba(160,208,240,.16);
  --line-2:rgba(160,208,240,.3);
  --ink:#EAF5FF; --ink-2:#9BBBD4; --ink-3:#66889F;
  --cyan:#6FD8FF; --cyanD:#238FC4;
  --amber:#FFC857; --magenta:#FF6BC1; --red:#FF5D73;
  --r-common:#8AA6BC; --r-uncommon:#6FD8FF; --r-rare:#FFC857;
  --r-exotic:#FF6BC1; --r-legendary:#FF5D73; --r-ghost:#DCEBFA;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --mono:'Azeret Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);background:var(--sky-top);
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
#skybg{position:fixed;inset:0;z-index:-3;background:var(--sky-top);transition:background 1.5s linear}
#skyhz{position:fixed;left:0;right:0;bottom:0;height:56%;z-index:-2;
  background:linear-gradient(180deg,transparent,var(--sky-mid) 44%,var(--sky-horizon) 79%,var(--sky-glow));
  transition:background 1.5s linear}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--star);transition:opacity 2s linear}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-bottom:calc(74px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:11px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;background:var(--panel-2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;flex:none}
.wm .a{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.2em;display:block;line-height:.95}
.wm .b{font-family:var(--mono);font-size:7.5px;letter-spacing:.28em;color:var(--ink-3);display:block;margin-top:3px}
.spacer{flex:1}
.pill{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;color:var(--ink-2);border:1px solid var(--line);
  border-radius:20px;padding:5px 9px;display:flex;align-items:center;gap:6px;background:rgba(6,16,28,.5)}
.pill .d{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.pill.on{color:var(--cyan);border-color:rgba(111,216,255,.42)}
.pill.on .d{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1px solid var(--line);background:rgba(6,16,28,.5);color:var(--ink-2);font-size:15px}
.ib:active{background:var(--panel-3)}
.eyebrow{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
.pad{padding:0 14px}

.scopewrap{padding:14px 14px 6px}
.scopeglass{position:relative;border-radius:50%;padding:8px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 16px 40px -22px #000}
.scope{position:relative;width:100%;aspect-ratio:1}
.scope svg{width:100%;height:100%;display:block;overflow:visible}
.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(111,216,255,.18) 0deg,rgba(111,216,255,0) 50deg,transparent 360deg);
  animation:sw 4.6s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0 49.4%,transparent 50%);
  mask:radial-gradient(circle,#000 0 49.4%,transparent 50%)}
@keyframes sw{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;opacity:.4}}
.rt{font-family:var(--mono);font-size:8px;fill:var(--ink-3)}
.cd{font-family:var(--disp);font-size:13px;font-weight:600;fill:var(--ink-2);letter-spacing:.12em}
.meta{display:flex;justify-content:space-between;gap:8px;padding:9px 16px 12px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--ink-3)}
.meta b{color:var(--cyan);font-weight:500}

.list{padding:0 14px 22px;display:flex;flex-direction:column;gap:8px}
.ct{display:flex;align-items:stretch;overflow:hidden;border-radius:14px;background:var(--panel);
  border:1px solid var(--line)}
.ct .edge{width:4px;flex:none;background:var(--r-common)}
.ct .core{flex:1;padding:9px 12px;min-width:0}
.ct .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ct .call{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.07em;line-height:1}
.ct .typ{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.07em;
  border:1px solid var(--line-2);padding:2px 6px;border-radius:5px}
.ct .tag{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.13em;padding:3px 6px;
  border-radius:5px;color:#04101B}
.ct .l2{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .l3{font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .act{flex:none;width:70px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;
  font-size:12.5px;letter-spacing:.11em;color:var(--cyan);border-left:1px solid var(--line);
  background:rgba(111,216,255,.08);line-height:1.15;text-align:center}
.ct .act:active{background:rgba(111,216,255,.3);color:#04101B}
.ct.got .act{color:var(--ink-3);background:none}
.empty{padding:30px 20px;text-align:center;margin:0 14px;border-radius:16px;background:var(--panel);
  border:1px solid var(--line)}
.empty h3{font-family:var(--disp);font-size:20px;letter-spacing:.12em;margin:0 0 7px}
.empty p{font-size:13px;color:var(--ink-2);margin:0;line-height:1.55}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);
  font-weight:600;font-size:15px;letter-spacing:.13em;padding:13px 18px;border-radius:12px;
  border:1px solid var(--line-2);color:var(--ink);background:var(--panel-3)}
.btn:active{background:rgba(111,216,255,.2)}
.btn.solid{background:var(--cyan);color:#04121C;border-color:transparent}
.btn.solid:active{filter:brightness(.88)}
.btn.danger{border-color:rgba(255,93,115,.4);color:var(--red)}
.btn.wide{width:100%}
.btn.sm{font-size:13px;padding:9px 13px;border-radius:9px}

/* ---- HUNT ---- */
.hunt{position:fixed;inset:0;z-index:10;overflow:hidden;background:#04101C;display:none;
  touch-action:none;user-select:none;-webkit-user-select:none}
.hunt.on{display:block}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#fakesky{position:absolute;inset:0;
  background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 46%,var(--sky-horizon) 77%,var(--sky-glow))}
.hudtop{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;
  display:flex;justify-content:center}
.compass{position:absolute;top:calc(env(safe-area-inset-top) + 46px);left:0;right:0;height:28px;z-index:5;
  -webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.compass svg{width:100%;height:100%}
#reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#mkHost{position:absolute;inset:0;z-index:3;pointer-events:none}
.mk{position:absolute;left:0;top:0;will-change:transform;display:flex;flex-direction:column;
  align-items:center;gap:3px}
.mk .box{padding:3px 7px;border-radius:7px;background:rgba(5,15,26,.66);border:1px solid var(--line-2);
  font-family:var(--mono);font-size:9px;white-space:nowrap;color:var(--ink-2)}
.mk .box b{font-family:var(--disp);font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.mk.lockon .box{border-color:var(--cyan);color:var(--cyan);background:rgba(6,34,52,.85)}
.hbottom{position:absolute;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));padding:0 14px;
  z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px}
.hmsg{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink-2);text-align:center;
  background:rgba(5,15,26,.7);border:1px solid var(--line);border-radius:20px;padding:8px 14px;max-width:96%}
.hmsg.hot{color:var(--cyan);border-color:rgba(111,216,255,.5)}
.guide{position:absolute;z-index:5;font-family:var(--disp);font-weight:700;font-size:13px;
  letter-spacing:.1em;color:var(--cyan);display:flex;align-items:center;gap:6px;
  background:rgba(5,15,26,.75);border:1px solid rgba(111,216,255,.4);border-radius:20px;padding:7px 11px;
  top:50%;transform:translateY(-50%);white-space:nowrap}

.overlay{position:fixed;inset:0;z-index:90;background:rgba(2,8,14,.88);display:none;
  flex-direction:column;justify-content:center;padding:16px;overflow-y:auto}
.overlay.on{display:flex}
.stage{perspective:1500px;max-width:420px;width:100%;margin:auto}
.c3d{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.85,.3,1)}
.c3d.flip{transform:rotateY(180deg)}
.face{border-radius:18px;overflow:hidden;backface-visibility:hidden;background:var(--panel-3);
  border:1px solid var(--line-2);box-shadow:0 26px 60px -26px #000}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.ctop .no{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-2)}
.ctop .tier{margin-left:auto;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.16em;
  padding:4px 8px;border-radius:6px;color:#04101B}
.art{position:relative;aspect-ratio:1.62;display:grid;place-items:center;padding:14px;
  background:rgba(5,15,26,.45);border-bottom:1px solid var(--line)}
.art svg{width:100%;height:100%}
.art .wk{position:absolute;top:9px;right:11px;font-family:var(--mono);font-size:8px;letter-spacing:.13em;
  color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:3px 7px}
.art .sb{position:absolute;bottom:9px;left:12px;right:12px}
.art .sb .t{font-family:var(--mono);font-size:7px;letter-spacing:.13em;color:var(--ink-3);margin-bottom:3px}
.art .sb .bar{height:3px;background:rgba(160,208,240,.16);border-radius:3px;overflow:hidden}
.art .sb .bar i{display:block;height:100%;background:var(--cyan)}
.cname{padding:13px 13px 5px}
.cname h2{font-family:var(--disp);font-weight:700;font-size:31px;line-height:.95;margin:0}
.cname .mf{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--ink-2);margin-top:5px;text-transform:uppercase}
.note{padding:10px 13px 12px;font-size:13px;line-height:1.5;color:var(--ink-2);
  border-top:1px solid var(--line);margin-top:11px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.sg div{padding:9px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sg div:nth-child(3n){border-right:none}
.sg .k{font-family:var(--mono);font-size:7px;letter-spacing:.13em;color:var(--ink-3)}
.sg .v{font-family:var(--disp);font-weight:600;font-size:19px;line-height:1.15;margin-top:2px}
.sg .v small{font-size:9px;font-weight:500;color:var(--ink-3)}
.cfoot{padding:10px 13px;font-family:var(--mono);font-size:8.5px;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:8px}
.back .rec{padding:13px;flex:1;overflow-y:auto}
.back h3{font-family:var(--disp);font-size:23px;letter-spacing:.08em;margin:0}
.route{display:flex;align-items:center;gap:9px;margin:14px 0}
.route .ap{text-align:center;flex:none}
.route .ap .cc{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1}
.route .ap .ci{font-family:var(--mono);font-size:8px;color:var(--ink-3);margin-top:4px;
  max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .arc{flex:1;height:24px}
.route .arc svg{width:100%;height:100%}
.rl{border-top:1px solid var(--line)}
.rl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px}
.rl .k{color:var(--ink-3);letter-spacing:.1em;font-size:8.5px;align-self:center}
.tapf{text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;color:var(--ink-3);padding:11px 0 0}

.tabs{display:flex;padding:0 10px;gap:2px;position:sticky;top:56px;z-index:40;overflow-x:auto;
  scrollbar-width:none;background:var(--panel-2);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.15em;padding:12px 11px;
  color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.prog{padding:14px}
.prog .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog .big{font-family:var(--disp);font-weight:700;font-size:27px}
.prog .big small{color:var(--ink-3);font-size:14px;font-weight:500}
.prog .bar{height:5px;background:rgba(160,208,240,.14);border-radius:4px;overflow:hidden;margin-top:9px}
.prog .bar i{display:block;height:100%;background:var(--cyan);transition:width .5s}
.filt{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:6px 10px;border-radius:14px;
  border:1px solid var(--line);color:var(--ink-3);white-space:nowrap;background:var(--panel)}
.filt button.on{color:var(--cyan);border-color:rgba(111,216,255,.45);background:rgba(111,216,255,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px;padding:4px 14px 26px}
.cell{position:relative;border-radius:13px;padding:9px 7px 7px;min-height:112px;display:flex;
  flex-direction:column;text-align:left;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.cell.blank{opacity:.34;border-style:dashed;justify-content:center;align-items:center}
.cell.blank .q{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--ink-3);letter-spacing:.12em}
.cell .sil{flex:1;display:grid;place-items:center}
.cell .sil svg{width:100%;height:100%;max-height:48px}
.cell .code{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.09em}
.cell .nm{font-size:9.5px;color:var(--ink-3);line-height:1.25;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cell::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--r-common)}
.cell.blank::before{display:none}
.cell .n{position:absolute;top:6px;right:7px;font-family:var(--mono);font-size:8.5px;font-weight:700;
  color:#04101B;background:var(--cyan);border-radius:9px;padding:1px 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;padding:4px 14px 26px}
.fc{position:relative;border-radius:13px;padding:11px 5px 8px;display:flex;flex-direction:column;
  align-items:center;gap:5px;text-align:center;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.fc.locked{opacity:.28;border-style:dashed}
.fc .fl{font-size:31px;line-height:1}
.fc.locked .fl{filter:grayscale(1) brightness(.6)}
.fc .cc{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em}
.fc .nm{font-size:8.5px;color:var(--ink-3);line-height:1.2;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%}
.fc .n{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:8px;font-weight:700;
  color:#04101B;background:var(--cyan);border-radius:8px;padding:1px 5px}
.rows{padding:4px 14px 26px;display:flex;flex-direction:column;gap:6px}
.ri{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line)}
.ri.locked{opacity:.3;border-style:dashed}
.ri .fl{font-size:19px;flex:none;line-height:1}
.ri.locked .fl{filter:grayscale(1) brightness(.6)}
.ri .cc{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--cyan);flex:none;width:44px}
.ri.locked .cc{color:var(--ink-3)}
.ri .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .sub{font-family:var(--mono);font-size:9px;color:var(--ink-3);flex:none}
.ri .n{font-family:var(--mono);font-size:9px;font-weight:700;color:#04101B;background:var(--cyan);
  border-radius:9px;padding:2px 7px;flex:none}
.li{display:flex;overflow:hidden;border-radius:12px;margin-bottom:7px;background:var(--panel);border:1px solid var(--line)}
.li .edge{width:4px;flex:none}
.li .c{padding:9px 12px;flex:1;min-width:0}
.li .t{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.06em}
.li .m{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

nav{position:fixed;bottom:0;left:0;right:0;z-index:80;display:flex;max-width:540px;margin:0 auto;
  background:var(--panel-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 3px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.15em;color:var(--ink-3)}
nav button svg{width:19px;height:19px;opacity:.6}
nav button.on{color:var(--cyan)}
nav button.on svg{opacity:1}

.sheet{position:fixed;inset:0;z-index:95;background:rgba(2,8,14,.84);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sin{width:100%;max-width:540px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:20px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .28s cubic-bezier(.2,.9,.3,1);background:var(--panel-3);border-top:1px solid var(--line-2)}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sin h3{font-family:var(--disp);font-size:23px;letter-spacing:.1em;margin:0 0 4px}
.sin p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:0 0 15px}
.f{margin-bottom:13px}

    const r2=[r[0]*ct+u[0]*st, r[1]*ct+u[1]*st, r[2]*ct+u[2]*st];
    const u2=[-r[0]*st+u[0]*ct, -r[1]*st+u[1]*ct, -r[2]*st+u[2]*ct];
    r=r2;u=u2;}
  return {f,r,u};
}
function lookAngles(){
  const {f}=cameraBasis();
  return {hdg:(toDeg(Math.atan2(f[0],f[1]))+360)%360, elev:toDeg(Math.asin(Math.max(-1,Math.min(1,f[2]))))};
}

/* =================== SUN → SKY =================== */
function sunAltitude(lat,lon,date){
  const n=date.getTime()/86400000+2440587.5-2451545.0;
  const rad=Math.PI/180;
  const L=(280.460+0.9856474*n)%360;
  const g=((357.528+0.9856003*n)%360)*rad;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad;
  const eps=(23.439-0.0000004*n)*rad;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  let gmst=(18.697374558+24.06570982441908*n)%24; if(gmst<0)gmst+=24;
  const H=(gmst*15+lon)*rad-ra;
  return Math.asin(Math.sin(lat*rad)*Math.sin(dec)+Math.cos(lat*rad)*Math.cos(dec)*Math.cos(H))/rad;
}
const SKY_STOPS=[
  [ 60,"#1E74AE","#3E9BCC","#7BC3E2","#A9DDF0",0.00],
  [ 25,"#1A639B","#3689BC","#68B0D4","#96CFE8",0.00],
  [  8,"#1B5480","#4A7CA0","#B98A62","#E8B07A",0.00],
  [  1,"#173F63","#4E5F82","#D6784E","#FFA96B",0.06],
  [ -4,"#102A47","#37406A","#A8474A","#D9663F",0.24],
  [ -8,"#0B1D35","#1E2A50","#4A3B66","#6E4A72",0.55],
  [-14,"#070F22","#0F1730","#1D2245","#2E2F55",0.88],
  [-20,"#03070F","#060B18","#0B1224","#121A30",1.00]];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);
  return "#"+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,"0")).join("");};
function skyPhase(alt){
  if(alt>10)return "DAYLIGHT";
  if(alt>0)return alt>4?"LOW SUN":"GOLDEN HOUR";
  if(alt>-0.833)return "SUNSET";
  if(alt>-6)return "CIVIL TWILIGHT";
  if(alt>-12)return "NAUTICAL TWILIGHT";
  if(alt>-18)return "ASTRONOMICAL TWILIGHT";
  return "NIGHT";
}
let lastSkyAlt=null;
function applySky(force){
  const alt=sunAltitude(state.lat,state.lon,new Date());
  if(!force&&lastSkyAlt!==null&&Math.abs(alt-lastSkyAlt)<0.15)return;
  lastSkyAlt=alt;
  let i=0; while(i<SKY_STOPS.length-1&&alt<SKY_STOPS[i+1][0])i++;
  let A=SKY_STOPS[i],B=SKY_STOPS[Math.min(i+1,SKY_STOPS.length-1)],t=0;
  if(A!==B)t=Math.max(0,Math.min(1,(A[0]-alt)/(A[0]-B[0])));
  const s=document.documentElement.style;
  s.setProperty("--sky-top",mix(A[1],B[1],t));
  s.setProperty("--sky-mid",mix(A[2],B[2],t));
  s.setProperty("--sky-horizon",mix(A[3],B[3],t));
  s.setProperty("--sky-glow",mix(A[4],B[4],t));
  s.setProperty("--star",(A[5]+(B[5]-A[5])*t).toFixed(2));
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute("content",mix(A[1],B[1],t));
  document.getElementById("skyLabel").textContent=
    skyPhase(alt)+" · SUN "+(alt>=0?"+":"")+alt.toFixed(0)+"°";
}

/* =================== SKY TRAFFIC =================== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const L26="ABCDEFGHJKLMNPQRSTUVWXYZ".split("");
const PRE={CA:"C-F",GB:"G-",IE:"EI-",DE:"D-A",FR:"F-G",NL:"PH-",ES:"EC-",PT:"CS-",IT:"EI-",CH:"HB-",
AT:"OE-",BE:"OO-",SE:"SE-",NO:"LN-",DK:"OY-",FI:"OH-",IS:"TF-",PL:"SP-",CZ:"OK-",HU:"HA-",GR:"SX-",
HR:"9A-",TR:"TC-",RU:"RA-",AE:"A6-",QA:"A7-",SA:"HZ-",KW:"9K-",IL:"4X-",EG:"SU-",MA:"CN-",ET:"ET-",
KE:"5Y-",ZA:"ZS-",NG:"5N-",JP:"JA",KR:"HL",CN:"B-",HK:"B-H",TW:"B-",SG:"9V-",MY:"9M-",TH:"HS-",
ID:"PK-",PH:"RP-C",VN:"VN-",IN:"VT-",PK:"AP-",AU:"VH-",NZ:"ZK-",FJ:"DQ-",BR:"PR-",CL:"CC-",
AR:"LV-",CO:"HK-",PA:"HP-",MX:"XA-"};
const MILCALL=["REACH","RCH","DOOM","SLAM","GRIM","VADER","BONE","SNAKE","TOPCAT","HOSER","JEDI","RAIDR"];

"F15","F18","EA18","F22","F35","A10","B52","B1","B2","V22","T38","T6","U2","RQ4","MQ9","H60","CH47",
"AH64","UH1","EUFI","RFAL","GRIP","TU95","AN12","AN26"]);
function regFor(op,mil){
  if(mil)return String(60+Math.floor(Math.random()*40))+"-"+(1000+Math.floor(Math.random()*8999));
  if(!op||op.cc==="US")return "N"+(100+Math.floor(Math.random()*899))+pick(L26)+pick(L26);
  return (PRE[op.cc]||"N")+pick(L26)+pick(L26)+pick(L26);}
function makeFlight(){
  const code=pick(FLEET_POOL), t=TYPES[code], mil=MILSET.has(code);
  const airliner=t.pax>=19&&t.mtow>10&&t.tail!=="rotor"&&!mil;
  const op=airliner&&Math.random()<.87?pick(OPERATOR_LIST):null;
  const b=Math.random()*360, r=(2+Math.random()*(state.rangeNm-4))*NM;
  const lat=state.lat+(r/111)*Math.cos(toRad(b));
  const lon=state.lon+(r/(111*Math.cos(toRad(state.lat))))*Math.sin(toRad(b));
  let alt,gs;
  if(t.tail==="rotor"){alt=500+Math.random()*3200;gs=t.cruise*(.55+Math.random()*.35);}
  else if(t.engType==="Piston"||t.engType==="None"){alt=1800+Math.random()*8500;gs=t.cruise*(.7+Math.random()*.35);}
  else if(airliner&&Math.random()<.6){alt=29000+Math.random()*13000;gs=t.cruise*(.88+Math.random()*.22);}
  else{alt=4000+Math.random()*22000;gs=t.cruise*(.55+Math.random()*.4);}
  alt=Math.min(alt,t.ceil);
  let origin=null,dest=null;
  if(op){const home=AIRPORT_LIST.filter(a=>a.cc===op.cc);
    origin=Math.random()<.55&&home.length?pick(home):pick(AIRPORT_LIST);
    let g=0;do{dest=pick(AIRPORT_LIST);g++;}while(dest.icao===origin.icao&&g<8);}
  return {id:Math.random().toString(36).slice(2,10),hex:Math.random().toString(16).slice(2,8),
    code,type:t,op,mil,
    call:mil?pick(MILCALL)+(10+Math.floor(Math.random()*89)):(op?op.icao+(1+Math.floor(Math.random()*3999)):regFor(null,false)),
    reg:regFor(op,mil),lat,lon,alt:Math.round(alt/25)*25,gs:Math.round(gs),
    track:Math.round(Math.random()*360),blocked:!mil&&Math.random()<.026,origin,dest,seen:Date.now()};
}
let lastSim=0;
function simTick(){
  const now=Date.now(), dt=Math.min(4,(now-(lastSim||now))/1000); lastSim=now;
  state.traffic.forEach(f=>{const km=f.gs*1.852/3600*dt;
    f.lat+=(km/111)*Math.cos(toRad(f.track));
    f.lon+=(km/(111*Math.cos(toRad(f.lat))))*Math.sin(toRad(f.track));});
  state.traffic=state.traffic.filter(f=>distKm(state.lat,state.lon,f.lat,f.lon)/NM<state.rangeNm*1.08);
  const target=9+Math.round(Math.random()*6);
  while(state.traffic.length<target)state.traffic.push(makeFlight());
}
function feedUrl(){
  const la=state.lat.toFixed(4), lo=state.lon.toFixed(4), r=Math.round(state.rangeNm);
  if(state.proxy)return `${state.proxy.replace(/\/$/,"")}/point/${la}/${lo}/${r}`;
  // when hosted, api/planes.js proxies and caches airplanes.live for us
  if(location.protocol==="http:"||location.protocol==="https:")
    return `/api/planes?lat=${la}&lon=${lo}&radius=${r}`;
  return `https://api.airplanes.live/v2/point/${la}/${lo}/${r}`;
}
async function fetchLive(){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
  let res; try{res=await fetch(feedUrl(),{signal:ctl.signal});}
  finally{clearTimeout(to);}
  if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();
  return (j.ac||j.aircraft||[]).filter(a=>a.lat&&a.lon).map(a=>{
    const code=(a.t||"").toUpperCase();
    const t=TYPES[code]||{dex:0,code:code||"????",name:a.desc||"Unidentified type",mfr:"Unknown",wake:"M",
      active:500,span:30,len:30,mtow:50,range:0,cruise:400,eng:2,mount:"wing",tail:"conv",sweep:25,
      tip:"none",ff:0,pax:0,ceil:45000,engType:"Turbofan",note:"Not in the reference library yet."};
    const cs=(a.flight||"").trim();
    return {id:a.hex,hex:a.hex,code:t.code,type:t,op:OPERATORS[cs.slice(0,3).toUpperCase()]||null,
      mil:a.dbFlags===1,call:cs||a.r||String(a.hex).toUpperCase(),reg:a.r||"—",lat:a.lat,lon:a.lon,
      alt:typeof a.alt_baro==="number"?a.alt_baro:(a.alt_geom||0),gs:Math.round(a.gs||0),
      track:Math.round(a.track||0),blocked:false,origin:null,dest:null,live:true,seen:Date.now()};});
}
let loop=null, NEAR=[], nearStamp=0;
function nearby(){
  const now=performance.now();
  if(now-nearStamp<180)return NEAR;
  nearStamp=now;
  NEAR=state.traffic.map(f=>{const g=distKm(state.lat,state.lon,f.lat,f.lon);
    f.distNm=g/NM; f.brg=bearing(state.lat,state.lon,f.lat,f.lon); f.elev=elevation(g,f.alt);
    f.overHorizon=f.elev<0; return f;})
    .filter(f=>f.distNm<=state.rangeNm).sort((a,b)=>a.distNm-b.distNm);
  return NEAR;
}
async function tick(){
  if(state.live){
    try{state.traffic=await fetchLive();setPill(true,"LIVE");}
    catch(e){state.live=false;setPill(false,"SIM");toast("Live feed unreachable — simulated sky");startLoop();return;}
  } else simTick();
  nearStamp=0;
  if(!state.huntOn){renderScope();renderList();}
  applySky(false);
}
function startLoop(){clearInterval(loop);tick();loop=setInterval(tick,state.live?6000:1200);}

/* =================== HUNT =================== */
const LOCK_MS=2000, LOCK_DEG=7;
const mkNodes=new Map();
let huntRaf=null;
function fovs(){
  const W=innerWidth,H=innerHeight;
  const long=Math.max(W,H), short=Math.min(W,H);
  const fLong=64*Math.PI/180;
  const fShort=2*Math.atan(Math.tan(fLong/2)*short/long);
  return W>=H?{h:fLong,v:fShort,W,H}:{h:fShort,v:fLong,W,H};
}
async function startCamera(){
  const v=document.getElementById("cam"), msg=document.getElementById("hMsg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent="NO CAMERA AVAILABLE — PAINTED SKY INSTEAD";return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},
      width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=st;v.style.display="block";state.camOn=true;
    document.getElementById("fakesky").style.display="none";
  }catch(e){msg.textContent="CAMERA BLOCKED — HOST OVER HTTPS TO ENABLE";}
}
function stopCamera(){
  const v=document.getElementById("cam");
  if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  v.style.display="none";state.camOn=false;
  document.getElementById("fakesky").style.display="";
}
function huntFrame(ts){
  if(!state.huntOn){huntRaf=null;return;}
  const dt=state.lastFrame?Math.min(100,ts-state.lastFrame):16; state.lastFrame=ts;
  const {f,r,u}=cameraBasis(), {h:fh,v:fv,W,H}=fovs();
  const th=Math.tan(fh/2), tv=Math.tan(fv/2);
  const list=nearby();
  const host=document.getElementById("mkHost");
  const alive=new Set();
  let best=null,bestAng=1e9;

  for(const a of list){
    if(a.overHorizon)continue; // genuinely behind the curve of the Earth — not visible
    const d=dirOf(a.brg,a.elev);
    const z=dot(d,f); if(z<=0.08)continue;
    const x=dot(d,r)/z, y=dot(d,u)/z;
    const px=W/2+(x/th)*(W/2), py=H/2-(y/tv)*(H/2);
    if(px<-90||px>W+90||py<-90||py>H+90)continue;
    const ang=toDeg(Math.acos(Math.max(-1,Math.min(1,z))));
    if(ang<bestAng){bestAng=ang;best=a;}
    alive.add(a.id);
    let n=mkNodes.get(a.id);
    if(!n){
      n=document.createElement("div"); n.className="mk";
      n.innerHTML=`<div class="glyph"></div><div class="box"><b></b> <span></span></div>`;
      host.appendChild(n); mkNodes.set(a.id,n);
      n._code=""; n._sz=0;
    }
    const got=SAVE.types[a.code];
    const col=got?"#8AA6BC":cssTier(a.type);
    const sz=Math.round(Math.max(20,Math.min(56,58-a.distNm*0.7)));
    if(n._code!==a.code+col||n._sz!==sz){
      const g=n.firstChild;
      g.style.width=sz+"px"; g.style.height=sz+"px";
      g.innerHTML=silhouette(a.type,{fill:col,trueScale:false});
      n._code=a.code+col; n._sz=sz;
    }
    n.firstChild.style.transform=`rotate(${(a.track-lookAngles().hdg).toFixed(0)}deg)`;
    const bx=n.lastChild;
    bx.firstChild.textContent=a.code;
    bx.lastChild.textContent=`${a.distNm.toFixed(0)}NM ${got?"×"+got.count:"NEW"}`;
    n.style.transform=`translate3d(${(px-40).toFixed(1)}px,${(py-sz/2).toFixed(1)}px,0)`;
    n.style.width="80px";
    n.classList.toggle("lockon",best===a&&bestAng<LOCK_DEG);
  }
  for(const [id,n] of mkNodes){if(!alive.has(id)){n.remove();mkNodes.delete(id);}}

  // lock-on: hold the target inside the reticle for two seconds
  const inRet=best&&bestAng<LOCK_DEG?best:null;
  const msg=document.getElementById("hMsg"), ring=document.getElementById("lockRing");
  if(inRet){
    if(state.lockId!==inRet.id){state.lockId=inRet.id;state.lockMs=0;}
    state.lockMs+=dt;
    const p=Math.min(1,state.lockMs/LOCK_MS);
    ring.setAttribute("stroke-dashoffset",(289*(1-p)).toFixed(1));
    ring.setAttribute("stroke",SAVE.types[inRet.code]?"#8AA6BC":cssTier(inRet.type));
    msg.className="hmsg hot";
    msg.textContent=`TRACKING ${inRet.call} · HOLD ${((LOCK_MS-state.lockMs)/1000).toFixed(1)}s`;
    if(state.lockMs>=LOCK_MS){
      state.lockMs=0;state.lockId=null;ring.setAttribute("stroke-dashoffset","289");
      doCatch(inRet); return;
    }
  } else {
    state.lockId=null;
    state.lockMs=Math.max(0,state.lockMs-dt*1.8);
    ring.setAttribute("stroke-dashoffset",(289*(1-state.lockMs/LOCK_MS)).toFixed(1));
    msg.className="hmsg";
    msg.textContent=state.hasCompass?"AIM THE CROSSHAIR AT A PLANE AND HOLD IT":"DRAG TO LOOK AROUND · CENTRE A PLANE AND HOLD";
  }
  drawCompass();
  drawGuide(list);
  huntRaf=requestAnimationFrame(huntFrame);
}
function drawCompass(){
  const {hdg,elev}=lookAngles();
  const {h:fh}=fovs(), halfDeg=toDeg(fh/2);
  let s="";
  const step=5, span=Math.ceil(halfDeg/step)*step;
  for(let d=-span;d<=span;d+=step){
    const b=(hdg+d+3600)%360, x=300+(d/halfDeg)*300;
    if(x<0||x>600)continue;
    const maj=Math.abs(b%30)<2.5||Math.abs(b%30-30)<2.5;
    s+=`<line x1="${x.toFixed(1)}" y1="${maj?5:11}" x2="${x.toFixed(1)}" y2="19" stroke="rgba(180,220,255,${maj?.75:.35})" stroke-width="1"/>`;
    if(maj)s+=`<text x="${x.toFixed(1)}" y="27" text-anchor="middle" font-family="Azeret Mono,monospace" font-size="9" fill="#9BBBD4">${String(Math.round(b/30)*30%360).padStart(3,"0")}</text>`;
  }
  s+=`<path d="M300 0 l5 7 h-10 z" fill="#6FD8FF"/>`;
  document.getElementById("compSvg").innerHTML=s;
  document.getElementById("hudTop").innerHTML=
    `<div class="hmsg" style="padding:6px 12px">HDG ${String(Math.round(hdg)).padStart(3,"0")}° · LOOK ${elev>=0?"+":""}${Math.round(elev)}° · ${NEAR.length} IN RANGE</div>`;
}
let guideEl=null;
function drawGuide(list){
  const layer=document.getElementById("huntLayer");
  if(!guideEl){guideEl=document.createElement("div");guideEl.className="guide";layer.appendChild(guideEl);}
  let t=state.trackId?list.find(a=>a.id===state.trackId&&!a.overHorizon):null;
  if(!t)t=list.find(a=>!SAVE.types[a.code]&&!a.overHorizon)||list.find(a=>!a.overHorizon);
  if(!t){guideEl.style.display="none";return;}
  const {hdg,elev}=lookAngles();
  let dx=((t.brg-hdg+540)%360)-180, dy=t.elev-elev;
  const {h:fh,v:fv}=fovs();
  if(Math.abs(dx)<toDeg(fh/2)&&Math.abs(dy)<toDeg(fv/2)){guideEl.style.display="none";return;}
  guideEl.style.display="flex";
  const horiz=Math.abs(dx)>Math.abs(dy);
  if(horiz){
    guideEl.style.left=dx>0?"auto":"10px"; guideEl.style.right=dx>0?"10px":"auto";
    guideEl.style.top="50%";
    guideEl.textContent=`${dx>0?"▶":"◀"} ${t.code} ${Math.abs(Math.round(dx))}°`;
  } else {
    guideEl.style.left="50%"; guideEl.style.right="auto";
    guideEl.style.top=dy>0?"22%":"74%";
    guideEl.textContent=`${dy>0?"▲":"▼"} ${t.code} ${Math.abs(Math.round(dy))}° ${dy>0?"UP":"DOWN"}`;
  }
}
function bindHuntDrag(){
  const el=document.getElementById("huntLayer");
  let sx=0,sy=0,y0=0,p0=0,on=false;
  const start=(x,y)=>{on=true;sx=x;sy=y;y0=state.viewYaw;p0=state.viewPitch;};
  const move=(x,y)=>{if(!on||state.hasCompass)return;
    const {h:fh,v:fv,W,H}=fovs();
    state.viewYaw=(y0-(x-sx)/W*toDeg(fh)*1.5+3600)%360;
    state.viewPitch=Math.max(-15,Math.min(89,p0+(y-sy)/H*toDeg(fv)*1.5));};
  el.addEventListener("touchstart",e=>start(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  el.addEventListener("touchmove",e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  el.addEventListener("touchend",()=>{on=false;},{passive:true});
  el.addEventListener("mousedown",e=>start(e.clientX,e.clientY));
  addEventListener("mousemove",e=>move(e.clientX,e.clientY));
  addEventListener("mouseup",()=>{on=false;});
}
function readScreenAngle(){
  state.screenAngle=(screen.orientation&&typeof screen.orientation.angle==="number")
    ? screen.orientation.angle : (window.orientation||0);
}
async function enableCompass(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted")return false;
    }
    const handler=e=>{
      if(e.alpha===null&&e.beta===null)return;
      // webkitCompassHeading is true north; alpha alone is not on iOS
      if(typeof e.webkitCompassHeading==="number"&&!isNaN(e.webkitCompassHeading))
        state.alpha=(360-e.webkitCompassHeading)%360;
      else if(e.alpha!==null)state.alpha=e.alpha;
      if(e.beta!==null)state.beta=e.beta;
      if(e.gamma!==null)state.gamma=e.gamma;
      state.hasCompass=true;
    };
    if("ondeviceorientationabsolute" in window)
      window.addEventListener("deviceorientationabsolute",handler,true);
    window.addEventListener("deviceorientation",handler,true);
    readScreenAngle();
    return true;
  }catch(err){return false;}
}

/* =================== CATCH =================== */
function doCatch(f){
  const t=f.type, now=Date.now(), firstType=!SAVE.types[f.code];
  const rec=SAVE.types[f.code]||{count:0,first:now,bestAlt:0,bestGs:0,closest:9999,regs:[]};
  rec.count++;rec.last=now;
  rec.bestAlt=Math.max(rec.bestAlt,f.alt);rec.bestGs=Math.max(rec.bestGs,f.gs);
  rec.closest=Math.min(rec.closest,+f.distNm.toFixed(1));
  if(f.reg&&f.reg!=="—"&&!rec.regs.includes(f.reg)&&rec.regs.length<400)rec.regs.push(f.reg);
  SAVE.types[f.code]=rec;
  const gains=[]; if(firstType&&t.active!==0)gains.push("AIRCRAFT");
  const bump=(store,key,label)=>{if(!key)return;
    if(!store[key]){store[key]={first:now,count:0};gains.push(label);}
    store[key].count=(store[key].count||0)+1;};
  if(f.op)bump(SAVE.operators,f.op.icao,"AIRLINE");
  [f.origin,f.dest].forEach(a=>{if(a){bump(SAVE.airports,a.icao,"AIRPORT");bump(SAVE.countries,a.cc,"FLAG");}});
  if(f.op)bump(SAVE.countries,f.op.cc,"FLAG");
  SAVE.catches++;
  SAVE.log.unshift({t:now,code:f.code,call:f.call,reg:f.reg,alt:f.alt,gs:f.gs,dist:+f.distNm.toFixed(1),
    brg:Math.round(f.brg),elev:Math.round(f.elev),op:f.op?f.op.icao:null,
    o:f.origin?f.origin.icao:null,d:f.dest?f.dest.icao:null,place:state.label,blocked:f.blocked});
  if(SAVE.log.length>400)SAVE.log.length=400;
  save();
  if(state.trackId===f.id)state.trackId=null;
  if(navigator.vibrate)navigator.vibrate(firstType?[20,45,30]:16);
  showCard(f,firstType,gains);
}

function renderDex(){
  const host=document.getElementById("dexHost"),tab=state.dexTab;
  const big=document.getElementById("dBig"),bar=document.getElementById("dBar"),lbl=document.getElementById("dLbl");
  const filt=document.getElementById("filt");
  const setP=(g,tot,label)=>{big.innerHTML=`${g}<small>/${tot}</small>`;
    bar.style.width=(tot?g/tot*100:0)+"%";lbl.textContent=label;};

  if(tab==="types"){
    filt.style.display="flex";
    const cats=["ALL",...Object.keys(CLASSES)];
    filt.innerHTML=cats.map(c=>`<button data-f="${c}" class="${state.filter===c?"on":""}">${c.toUpperCase()}</button>`).join("");
    filt.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{state.filter=b.dataset.f;renderDex();}));
    let list=state.filter==="ALL"?TYPE_LIST:TYPE_LIST.filter(CLASSES[state.filter]);
    const found=list.filter(t=>SAVE.types[t.code]);
    setP(found.length,list.length,state.filter==="ALL"?"AIRCRAFT LOGGED":state.filter.toUpperCase()+" LOGGED");

        <p>Aircraft only appear here once you have caught one. ${list.length} are out there.</p></div>`;
      return;
    }
    const unknown=list.length-found.length;
    const blanks=Math.min(unknown,24);
    host.innerHTML=found.map(t=>{
      const rec=SAVE.types[t.code],col=cssTier(t);
      return `<button class="cell" data-t="${t.code}" style="--r-common:${col}">
        <span class="n">×${rec.count}</span>

        <div class="code">${esc(t.code)}</div><div class="nm">${esc(t.name)}</div></button>`;}).join("")
      + Array.from({length:blanks},()=>`<div class="cell blank"><span class="q">???</span></div>`).join("");
    if(unknown>blanks)host.insertAdjacentHTML("afterend","");
    host.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>openDexCard(b.dataset.t)));
    if(unknown)host.innerHTML+=`<div style="grid-column:1/-1;text-align:center;padding:14px 0 0"

    host.className="rows";
    host.innerHTML=got.sort((a,b)=>SAVE.operators[b.icao].count-SAVE.operators[a.icao].count).map(o=>{
      const r=SAVE.operators[o.icao];
      return `<div class="ri"><span class="fl">${o.flag}</span><span class="cc">${esc(o.icao)}</span>
        <span class="nm">${esc(o.name)}</span><span class="n">×${r.count}</span></div>`;}).join("")
      || `<div class="empty"><h3>NO AIRLINES YET</h3><p>Catch an airliner and its operator is logged here.</p></div>`;
  }
  else if(tab==="airports"){
    filt.style.display="none";
    const got=AIRPORT_LIST.filter(a=>SAVE.airports[a.icao]);
    setP(got.length,AIRPORT_LIST.length,"AIRPORTS LOGGED");
    host.className="rows";
    host.innerHTML=got.sort((a,b)=>SAVE.airports[b.icao].count-SAVE.airports[a.icao].count).map(a=>{
      const r=SAVE.airports[a.icao];
      return `<div class="ri"><span class="fl">${a.flag}</span><span class="cc">${esc(a.iata)}</span>

      || `<div class="empty"><h3>NO AIRPORTS YET</h3><p>Catch a flight that is broadcasting a route.</p></div>`;
  }
  else{
    filt.style.display="none";
    const got=Object.keys(SAVE.countries).length;
    setP(got,COUNTRY_LIST.length,"FLAGS COLLECTED");
    host.className="fgrid";
    host.innerHTML=COUNTRY_LIST.map(c=>{const r=SAVE.countries[c.cc];
      return `<div class="fc ${r?"":"locked"}">${r?`<span class="n">×${r.count}</span>`:""}

const ESCMAP={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};

(function stars(){
  const c=document.getElementById("stars"),x=c.getContext("2d");
  let pts=null;
  function draw(){
    const w=c.width=innerWidth,h=c.height=innerHeight;
    if(!pts)pts=Array.from({length:140},()=>({x:Math.random(),y:Math.random()*.74,
      a:Math.random()*.85,r:Math.random()<.12?1.5:.8}));
    x.clearRect(0,0,w,h);
    pts.forEach(p=>{x.beginPath();x.arc(p.x*w,p.y*h,p.r,0,6.29);
      x.fillStyle=`rgba(220,240,255,${(p.a*(1-p.y/.9)).toFixed(2)})`;x.fill();});
  }
  draw();let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(draw,220);});
})();

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",async()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const v=b.dataset.view, hunt=document.getElementById("huntLayer");
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  if(v==="hunt"){
    state.huntOn=true;state.lastFrame=0;hunt.classList.add("on");
    mkNodes.forEach(n=>n.remove());mkNodes.clear();
    readScreenAngle();
    if(!state.hasCompass)await enableCompass();
    if(!state.camOn)await startCamera();
    if(!huntRaf)huntRaf=requestAnimationFrame(huntFrame);
  } else {
    state.huntOn=false;hunt.classList.remove("on");stopCamera();
    if(huntRaf){cancelAnimationFrame(huntRaf);huntRaf=null;}
    document.getElementById("v-"+v).classList.add("on");
    scrollTo({top:0});
    if(v==="dex")renderDex(); else if(v==="log")renderLog(); else {renderScope();renderList();}
  }
}));
document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");state.dexTab=t.dataset.tab;renderDex();});
document.getElementById("btnSet").addEventListener("click",openSettings);
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.currentTarget.classList.remove("on");});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeOverlay();});
addEventListener("orientationchange",readScreenAngle);
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",readScreenAngle);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){clearInterval(loop);loop=null;}
  else if(!loop)startLoop();});

(async function boot(){
  await load();
  bindHuntDrag(); readScreenAngle(); applySky(true);
  setInterval(()=>applySky(false),60000);
  setPill(false,"SIM");
  for(let i=0;i<11;i++)state.traffic.push(makeFlight());
  renderAll();
  // hosted? the bundled proxy exists, so go straight to real aircraft
  if(location.protocol==="https:"||location.protocol==="http:"){state.live=true;setPill(false,"…");}
  startLoop();
  if(!SAVE.catches)setTimeout(()=>toast("Open HUNT, aim at a plane, hold it for two seconds"),1500);
})();

</script>
</body>
